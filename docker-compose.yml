services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sukilo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sukilo
      POSTGRES_PASSWORD: sukilo
      POSTGRES_DB: sukilo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukilo -d sukilo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sukilo-network

  backend:
    container_name: sukilo-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://sukilo:sukilo@postgres:5432/sukilo
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: http://localhost:8000
      MODEL_VERSION: phash-color-v1
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sukilo-network

volumes:
  postgres_data:
  backend_uploads:

networks:
  sukilo-network:
    driver: bridge